# 调试开关
# 说明：默认关闭。开启后，程序结束前会全量打印 SQLite 缓存表结构与所有数据，并保守清理核心表残留旧字段。
# 支持环境变量 FCL_DEBUG=1 覆盖此配置。
debug: false

# 爬虫相关配置
# 说明：从友链 JSON 中读取站点列表，抓取各站点 RSS 文章，并生成 all.json。
#   enable:        是否启用爬虫
#   json_url:      友链 JSON 地址，仅支持网络地址
#   article_count: 每个站点最多抓取的文章数量
# 友链真源模式：local（默认）| remote
#   local  = 真源在 FCL 仓库 friends.json（下方 json_url 指向本仓库 raw.githubusercontent.com，
#            或自行改为本地路径/镜像地址均可）。FCL 负责维护该文件，申请通过会自动写回。
#   remote = 真源在外部博客友链端点（如你博客的 /friends.json）。此时把 json_url 改成该端点地址，
#            FCL 仅作巡检展示，不再写回/维护本地 friends.json；
#            对应的 Issue 机制整套关闭（自助申请开箱即关单、巡检回评整体跳过，详见 docs/deploy.md），
#            要加友链请直接改博客仓库的友链配置。
#   切换为他人部署场景：不想在 FCL 仓库维护友链、博客已有真源时，用 remote 并填博客端点即可。
# 真源已迁移为 FCL 格式（name/link/url/avatar/linkpage/verified），
# 由本仓库 friends.json 提供，弃用旧 check-flink 格式的 friends.yufish.cn。
# 读取层对博客格式（title/siteurl/imgurl）做了别名兼容，remote 模式直接填博客端点也能解析。
spider_settings:
  enable: true
  source: local

  json_url: "https://raw.githubusercontent.com/ImYufish/Friend-Circle-Lite/main/friends.json"
  article_count: 5
  # 真源在外部端点（source=remote）时，端点 JSON 的顶层键名，默认 friends。
  # 别人的端点可能用 link_list / data 等，配这里即可，FCL 不再硬编码 friends。
  list_key: "friends"
  # 友链字段桥接映射（键 = FCL 内部字段名，值 = 外部端点/博客字段名）。
  # 读取侧按此从端点取字段；发布 friends.json 时也按同一份映射重命名输出（正反复用，单一真相源）。
  # 【本仓库约定】把 FCL 的全部友链字段都列出来：
  #   - 值留空 ""  → 走默认，即直接用 FCL 字段名本身（name/link/avatar/linkpage/verified）；
  #   - 值填了    → 表示外部端点用的是这个名字，按它取/重命名。
  # 配置解析时会自动丢弃空值/同名项，因此“留空”等价于“不映射、用 FCL 原生字段”。
  # 你自己的 friends.json 用 FCL 格式，故默认全留空即可；下面 5 项是 FCL 读取侧的全部字段。
  friends_input:
    rename:
      name: ""
      link: ""
      avatar: ""
      linkpage: ""
      verified: ""
    # 示例：对齐博客 my-blog 真源格式时，把对应项填上即可（其余留空）：
    #   name: title
    #   link: siteurl
    #   avatar: imgurl

# 代理配置
# 说明：用于友链检测和 RSS 抓取。程序会先直连，请求失败且配置了代理时自动走代理。
#   proxy_url: 代理地址涉及一定违规风险和隐私风险，请尽量不要写入配置文件。
#              推荐在仓库环境变量 PROXY_URL 中配置，并让此处保持为空。
#              推荐格式为代理前缀，例如 https://proxy.example.com/
#              程序会自动拼接为 https://proxy.example.com/https://example.com/feed.xml
#              如需自行搭建代理，可参考：https://blog.liushen.fun/posts/dd89adc9/
#              兼容高级格式 https://proxy.example.com?url={url}，但普通反代场景不推荐这样写。
#              留空则不使用代理。
proxy_settings:
  proxy_url: ""

# 数据合并配置
# 说明：合并多个数据源的结果，比如国内和国外两条线路各自运行后的 all.json、link.json、errors.json。
#   enable:                是否启用数据合并
#   remote_base_url:       远程数据源基础 URL，会自动拼接 /all.json、/link.json、/errors.json
#   merge_article_data:    是否合并友圈文章数据
#   merge_link_check_data: 是否合并友链可达性数据
merge_settings:
  enable: false
  remote_base_url: "https://fc.liushen.fun"
  merge_article_data: true
  merge_link_check_data: true

# 友链可达性检测配置
# 说明：友圈抓取依赖此检测结果，因此该检测始终启用。旧配置中的 link_check.enable 会被兼容读取但不再生效。
#   max_age_hours:         同一友链检测结果缓存时间，默认 24 小时
#   timeout:               单次网页请求超时时间
#   max_workers:           并发检测数量
#   status_api_url:        兜底状态码 API；API-only 结果只用于可达性展示，不参与 RSS 抓取
#   enable_backlink_check: 是否检测友链页是否包含你的站点链接
#   author_url:            你的站点域名，用于反链检测，建议只填写域名
#   eo_ping_url:           国内延迟探针端点（可选）。钉在国内地域的 EdgeOne 云函数地址，
#                          配置后额外测一个"国内视角"延迟并自动取优显示；留空则不启用。
#                          推荐在仓库环境变量 EO_PING_URL 中配置，并让此处保持为空。
#   backlink_headless:     静态 HTML 未命中作者域名时，是否用无头浏览器（Playwright）渲染
#                          友链页后再判定。用于 VitePress / Astro 等客户端渲染友链的站点，
#                          可自动识别这类"JS 渲染站"的反链，免去手动标 verified。
#                          需运行环境安装 playwright + chromium（见 requirements.txt 与 CI 步骤）；
#                          未安装时自动跳过、不影响既有流程。可用环境变量 BACKLINK_HEADLESS=0 关闭。
link_check:
  # 注意：设为 0 会导致缓存永不复用，每轮（含定时）都全量重测可达性/速度/反链
  max_age_hours: 24
  timeout: 25
  max_workers: 10
  status_api_url: "https://v2.xxapi.cn/api/status?url={url}"
  enable_backlink_check: true
  author_url: "x1anyu.cn"
  eo_ping_url: ""
  backlink_headless: true

# 主检测后的旁路处理配置
# 说明：各步骤开关集中在此，环境变量仅用于敏感信息与 CI 临时覆盖（同原生惯例）。
#   enable:            postprocess 总开关，false 时跳过全部后处理
#   geo_diagnose:      不可达站点地域屏蔽二次诊断
#     enable:          是否启用
#     cn_probe:        是否做国内视角二次探测
#   siteshot:          友链主页截图回填与图床上传
#     enable:          是否启用
#     upload_folder:   图床上传目录
#     max_workers:     并发截图数量
#     upload_url:      图床上传端点；推荐走仓库环境变量 IMG_UPLOAD_URL，此处留空
#     refresh_days:    截图有效期（天）：图龄超过该天数自动重新截图；0=永久有效
#   alert:             状态翻转告警
#     enable:          是否启用
#     qq_bot_alert_url: QQ 告警中转地址（blog-bot /api/alert）；推荐走环境变量 QQ_BOT_ALERT_URL
#     wecom_webhook_url: 企业微信 webhook 兜底渠道；推荐走环境变量 WECOM_WEBHOOK_URL
postprocess:
  enable: true
  geo_diagnose:
    enable: true
    cn_probe: true
  siteshot:
    enable: true
    upload_folder: "friends"
    max_workers: 2
    upload_url: ""
    refresh_days: 7
  alert:
    enable: true
    qq_bot_alert_url: ""
    wecom_webhook_url: ""

# 友链字段重命名（读取外部端点 + 发布 friends.json 共用一份映射）
# 已统一到上方 spider_settings.friends_input，此处不再单独配置 friends_output。
# 读取侧按 friends_input.rename 从端点取字段，发布侧按同一份 rename 重命名输出，
# 单一真相源，避免读写两份映射不一致。

# 邮件推送功能配置，暂未实现，等待后续开发
# 说明：每次运行后向指定邮箱推送所有友链文章更新。
email_push:
  enable: false
  to_email: recipient@example.com
  subject: "今天的 RSS 订阅更新"
  body_template: "rss_template.html"

# 邮件 issue 订阅功能配置
# 说明：从 GitHub issue 中提取订阅邮箱，并推送你自己站点的新文章。
rss_subscribe:
  enable: false
  github_username: willow-god
  github_repo: Friend-Circle-Lite
  your_blog_url: https://blog.liushen.fun/
  email_template: "./push_templates/default.html"
  website_info:
    title: "清羽飞扬"

# SMTP 配置
# 说明：用于上方邮件相关功能。如果不使用邮件功能，可关闭 email_push 和 rss_subscribe。
smtp:
  email: notify@liushen.fun
  server: smtp.exmail.qq.com
  port: 465
  use_tls: true

# 特殊 RSS 地址指定
# 说明：用于指定特殊 RSS 地址，比如 B 站专栏等不常见 RSS 地址后缀。可以置空，但不要删除此项。
specific_RSS:
  - name: "阮一峰"
    url: "http://feeds.feedburner.com/ruanyifeng"
  # - name: "无名小栈"
  #   url: "https://blog.imsyy.top/rss.xml"
